name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ cmake pkg-config libsystemd-dev python3

      - name: Build
        run: cmake -B build && cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
